<svg xmlns="http://www.w3.org/2000/svg" width="200pt" height="200pt" viewBox="0 0 200 200" version="1.1">
  <!-- OrniFlight — Ornithopter motor order / twin-flapter layout -->
  <!-- Left wing -->
  <path style="fill:none;stroke:#d04020;stroke-width:8;stroke-linecap:round;stroke-linejoin:round"
        d="M 100 80 Q 60 30 30 50 Q 20 60 30 70 Q 60 50 100 90 Z"/>
  <!-- Right wing -->
  <path style="fill:none;stroke:#20a040;stroke-width:8;stroke-linecap:round;stroke-linejoin:round"
        d="M 100 80 Q 140 30 170 50 Q 180 60 170 70 Q 140 50 100 90 Z"/>
  <!-- Body -->
  <ellipse style="fill:#606060;stroke:#404040;stroke-width:3" cx="100" cy="110" rx="14" ry="40"/>
  <!-- Head -->
  <circle style="fill:#606060;stroke:#404040;stroke-width:3" cx="100" cy="60" r="10"/>
  <!-- Center circle (FC) -->
  <circle style="fill:none;stroke:#f0c040;stroke-width:4" cx="100" cy="120" r="16"/>
  <text style="fill:#f0c040;font-family:monospace;font-size:10px;text-anchor:middle" x="100" y="123">FC</text>
  <!-- Left servo label -->
  <text style="fill:#d04020;font-family:monospace;font-size:8px;text-anchor:middle" x="42" y="55">S1</text>
  <!-- Right servo label -->
  <text style="fill:#20a040;font-family:monospace;font-size:8px;text-anchor:middle" x="158" y="55">S2</text>
</svg>
